services:
    jahia:
        image: '${JAHIA_IMAGE}'
        container_name: jahia
        ports:
            - '8080:8080'
            - '8000:8000'
        environment:
            - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
            - JAHIA_LICENSE=${JAHIA_LICENSE}
            - JPDA=true
        extra_hosts:
            - jahia:127.0.0.1
            # The indexer fetches pages from the host named by the module's server name, and that same name is
            # stored in CustomGPT as the citation URL. CustomGPT validates it with Laravel's `url` rule, whose
            # host pattern requires a dot or an IP - so the bare "jahia" is rejected with HTTP 422 "The url is
            # not a valid URL" and NOTHING can be indexed. A dotted alias for the same loopback satisfies it.
            - jahia.localhost:127.0.0.1
            # A SECOND dotted alias for the same loopback. 05-server-name sets the site's sitemapIndexURL to one
            # and the server-name override to the other, so the URL CustomGPT stores says which of the two won.
            # With a single host the test would pass whether the override were applied or silently ignored.
            - override.jahia.localhost:127.0.0.1
        networks:
            - stack
    cypress:
        image: '${TESTS_IMAGE}'
        # https://github.com/cypress-io/cypress/issues/350
        ipc: host
        container_name: cypress
        depends_on:
            - jahia
        environment:
            - MANIFEST=${MANIFEST}
            - SUPER_USER_PASSWORD=${SUPER_USER_PASSWORD}
            - JAHIA_URL=http://jahia:8080
            - NEXUS_USERNAME=${NEXUS_USERNAME}
            - NEXUS_PASSWORD=${NEXUS_PASSWORD}
            - CUSTOMGPT_PROJECT_ID=${CUSTOMGPT_PROJECT_ID}
            - CUSTOMGPT_TOKEN=${CUSTOMGPT_TOKEN}
            - CUSTOMGPT_API_BASE_URL=${CUSTOMGPT_API_BASE_URL}
            - JAHIA_SITE_KEY=${JAHIA_SITE_KEY}
        networks:
            - stack
networks:
    stack:
