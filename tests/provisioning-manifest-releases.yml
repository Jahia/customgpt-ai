# Provisioning manifest for running the suite against a RELEASED Jahia.
#
# Used by default via MANIFEST in .env.example. To run explicitly:
#   JAHIA_IMAGE=ghcr.io/jahia/jahia-ee-dev:8.2.3.2 \
#   MANIFEST=provisioning-manifest-releases.yml docker-compose up --abort-on-container-exit
#
# Make LATEST resolve to releases, by making jahia-releases the ONLY Maven repository.
#
# Jahia auto-installs a module's Jahia-Depends at version LATEST. The stock image resolves
# that against an aggregate repository group that also carries snapshots, so LATEST returns
# e.g. serverSettings 10.0.0-SNAPSHOT. That build declares a newer Jahia than the one under
# test, so it never resolves - and Jahia has already STOPPED the working serverSettings to
# make way for it. The result is no serverSettings at all, which takes down the server
# administration UI that hosts this module's settings panel.
#
# addMavenRepository cannot fix this: it appends, leaving the snapshot source in place. The
# repository list has to be REPLACED, which is what this does.
#
# ONE repository, deliberately. jahia-releases is releases-only, so LATEST/RELEASE can never
# resolve to a snapshot, and it carries everything this harness resolves:
#   - digitall 3.0.0 AND its site export digitall-3.0.0-import.zip, which
#     assets/provisioning.yml imports via importSite. jahia-public-app-store does NOT carry
#     that zip (the repository exists and serves other modules, but returns 404 for
#     digitall-3.0.0-import.zip), so configuring the app store here leaves /sites/digitall
#     uncreated and 02-indexing / 03-new-page fail on PathNotFoundException.
#   - serverSettings 9.10.0, which requires Jahia 8.2.0.0 and so suits the pinned image.
#   - graphql-dxm-provider 3.9.1 and sitemap 5.5.0, this module's Jahia-Depends.
# customgpt-ai itself is installed from the local build in artifacts/, not resolved here.
#
# Listing several repositories was tried and did NOT work: with two comma-separated entries,
# resolution still ended up against one of them whichever order was used, and digitall's
# classified zip:import artifact 404'd. The mechanism was not established - pax-url-aether does
# document comma-separated lists, so the likely culprit is how editConfiguration types a
# comma-containing scalar before ConfigurationAdmin sees it, rather than pax-url itself. If that
# is ever resolved, a multi-repository list would remove the single-repository constraint here.
#
# Caveat worth knowing: jahia-releases is a hosted repository, not a proxying group, so it does
# not serve Maven Central. Everything this harness resolves is org.jahia.modules and present, but
# a future third-party mvn: coordinate would 404 with an error that is hard to trace back here.
- editConfiguration: 'org.ops4j.pax.url.mvn'
  properties:
    org.ops4j.pax.url.mvn.repositories: 'https://devtools.jahia.com/nexus/content/repositories/jahia-releases@id=jahia-releases'
- include: 'provisioning.yml'
