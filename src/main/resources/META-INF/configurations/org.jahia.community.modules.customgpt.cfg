# default configuration - won't be overridden
org.jahia.community.modules.customgpt.content.indexedMainResourceTypes=jnt:page,jmix:mainResource
org.jahia.community.modules.customgpt.content.indexedSubNodeTypes=jmix:droppableContent
org.jahia.community.modules.customgpt.content.indexedFileExtensions=pdf
org.jahia.community.modules.customgpt.operations.batch.size=500
org.jahia.community.modules.customgpt.projectId=
org.jahia.community.modules.customgpt.token=
org.jahia.community.modules.customgpt.jahia.username=
org.jahia.community.modules.customgpt.jahia.password=
org.jahia.community.modules.customgpt.jahia.serverCookie.name=
org.jahia.community.modules.customgpt.jahia.serverCookie.value=
org.jahia.community.modules.customgpt.jahia.serverCookie.domain=
# User-Agent sent when fetching a page's rendered HTML. Leave empty to use the HTTP client default.
# Set it when the site sits behind bot protection (WAF/CDN rule) that refuses the default agent - such a site
# cannot be indexed at all, because the fetch is rejected before any content is produced.
# Printable ASCII only, no line breaks; an illegal value is reported and ignored.
# Example: Mozilla/5.0 (compatible; JahiaIndexer/1.0)
org.jahia.community.modules.customgpt.userAgent=
# Server name the indexed pages are fetched from and cited under: a bare host (academypp.jahia.com), a host with
# a port, or a full scheme://host[:port]. With no scheme, https is assumed.
# Leave empty to use each site's own sitemapIndexURL host (the default behaviour).
# Set it when the site node does not name the host its pages are actually served from - e.g. a preproduction
# instance restored from a production export, which still carries the production sitemapIndexURL.
# The host must not be a literal private/loopback IP; the render request carries the Jahia credentials below.
org.jahia.community.modules.customgpt.serverName=
# Per-site override, which wins over the value above. Replace <siteKey> with a real site key - the site key
# segment is required, and a line reading .site.serverName is reported and ignored.
#org.jahia.community.modules.customgpt.site.<siteKey>.serverName=academypp.jahia.com
org.jahia.community.modules.customgpt.dryRun=true
org.jahia.community.modules.customgpt.rateLimit.requestsPerSecond=10
