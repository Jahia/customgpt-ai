version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # The jahia-modules parent and org.jahia.* artifacts define the target Jahia version
      - dependency-name: "org.jahia.*"
      # 2.x is compiled for Java 17; the module builds on JDK 11
      - dependency-name: "com.github.eirslett:frontend-maven-plugin"
        update-types: ["version-update:semver-major"]
      # Embedded runtime client: 5.x needs the okhttp-jvm artifact and the Kotlin 2 stdlib in the bundle
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      # Platform-provided APIs: bumping them raises Import-Package/Require-Capability floors
      # beyond what Jahia 8.2 ships (Felix SCR 2.1.30 / DS 1.4, graphql-java-annotations 21.1)
      - dependency-name: "org.osgi:*"
      - dependency-name: "io.github.graphql-java:*"
      - dependency-name: "com.graphql-java:*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Module Federation shared libraries must match the versions provided by Jahia
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redux"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-redux"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Babel 8 needs Node >= 22.18 and plugin migration; @jahia/eslint-config expects eslint 8
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      npm-tests-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Babel 8 needs Node >= 22.18 and plugin migration; @jahia/eslint-config expects eslint 8
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
